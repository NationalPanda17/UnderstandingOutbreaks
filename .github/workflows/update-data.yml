name: Update data and deploy
# Data update, every six hours. An external timer (scheduler/) starts it on time; the schedules below are the fallback. The 05:17 UTC run always rebuilds and deploys; the other three stop after
# the pipeline step when nothing changed (no new or revised value, no change to an outbreak), so an unchanged run
# publishes nothing and saves no snapshot. A manual run, and a run started by the hourly notice check, always deploy
# (a manual run can ask for the stop-when-unchanged behaviour with the only_if_changed input).
# Sources are checked on their own cadence inside the pipeline (daily and weekly sources every
# run, monthly sources weekly, yearly sources monthly). On any failure the last good snapshot stays live and a GitHub
# issue is opened. This workflow never opens pull requests and never changes code or configuration.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      linkcheck: { description: "Also check source links", type: boolean, default: false }
      only_if_changed: { description: "Stop after the pipeline when nothing changed (as the extra scheduled runs do)", type: boolean, default: false }
  workflow_call:
    inputs:
      linkcheck: { type: boolean, default: false }
    secrets: { CLOUDFLARE_API_TOKEN: { required: false }, CLOUDFLARE_ACCOUNT_ID: { required: false }, R2_ACCESS_KEY_ID: { required: false }, R2_SECRET_ACCESS_KEY: { required: false } }
permissions:
  contents: read
  issues: write
  actions: write   # only to start the live-site health check after a deploy
concurrency: { group: update-data, cancel-in-progress: false }
env:
  # 'false' only for the three extra scheduled runs, which deploy only when something changed. The daily run, the
  # weekly run, and runs started by a person or by the notice check always deploy.
  ALWAYS_DEPLOY: ${{ github.event.schedule != '17 11,17,23 * * *' && inputs.only_if_changed != true }}
  # Two buckets, on purpose. R2_BUCKET is public and holds only files that may be redistributed (tool runtimes and
  # the redistributable part of the raw archive). R2_STATE_BUCKET is private and holds pipeline state, which
  # includes raw source files whose licence does not allow redistribution. State is never written to the public bucket.
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
  R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 answers a burst of small uploads with "reduce your concurrent request rate": retry patiently, upload gently.
  AWS_MAX_ATTEMPTS: "10"
  AWS_RETRY_MODE: adaptive
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WRANGLER_SEND_METRICS: "false"   # no usage telemetry from the deploy tool
jobs:
  # The schedules above are the fallback: an external timer (scheduler/) starts this workflow on time, because
  # GitHub's scheduler can be hours late. A run started by GitHub's own timer is skipped when another full update
  # ran in the previous three hours, so a late fallback run does not repeat the work.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          go=true
          if [ "${{ github.event.schedule }}" = "17 5 * * *" ] || [ "${{ github.event.schedule }}" = "17 11,17,23 * * *" ]; then
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/update-data.yml/runs?per_page=15" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != "failure" and .conclusion != "cancelled" and .conclusion != "skipped") | .created_at][0] // ""' || echo "")
            if [ -n "$last" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -lt 10800 ]; then
                go=false
                echo "Another full update started $((age / 60)) minutes ago, so this fallback run is skipped." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Restore pipeline state (revision history, raw archive index, last good data) from R2
        if: env.R2_STATE_BUCKET != '' && env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws s3 sync "s3://$R2_STATE_BUCKET/state/" state/ --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync "s3://$R2_STATE_BUCKET/published/data/" site/public/data/ --endpoint-url "$R2_ENDPOINT" --only-show-errors
      - name: Restore pipeline state from the Actions cache (when R2 is not configured)
        if: env.R2_STATE_BUCKET == '' || env.AWS_ACCESS_KEY_ID == ''
        uses: actions/cache@v4
        with: { path: "state\nsite/public/data", key: "uo-state-${{ github.run_id }}", restore-keys: "uo-state-" }
      - name: Fetch, archive, validate, record revisions, compute, publish (atomic)
        id: pipeline
        working-directory: pipeline
        run: python -m uo.build
      - name: Nothing changed
        if: env.ALWAYS_DEPLOY != 'true' && steps.pipeline.outputs.changed != 'true'
        run: echo "No new or revised data since the last snapshot. Nothing is rebuilt or deployed." >> "$GITHUB_STEP_SUMMARY"
      - name: Check source links
        if: inputs.linkcheck || github.event.schedule == '23 6 * * 1'
        working-directory: pipeline
        run: python -m uo.linkcheck
      - name: Source traceability tests (deployment is blocked if these fail)
        if: (env.ALWAYS_DEPLOY == 'true' || steps.pipeline.outputs.changed == 'true')
        working-directory: pipeline
        run: python -m pytest -q tests/test_traceability.py
      - uses: actions/setup-node@v4
        if: (env.ALWAYS_DEPLOY == 'true' || steps.pipeline.outputs.changed == 'true')
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - working-directory: site
        if: (env.ALWAYS_DEPLOY == 'true' || steps.pipeline.outputs.changed == 'true')
        run: npm ci && node scripts/prepare-tools.mjs && npm run check:i18n && npm run build && npm run check:bundles
      - name: Save pipeline state to the private R2 bucket
        if: env.R2_STATE_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && (env.ALWAYS_DEPLOY == 'true' || steps.pipeline.outputs.changed == 'true')
        run: |
          aws configure set default.s3.max_concurrent_requests 4
          # sync is safe to repeat: a second pass uploads only what the first one missed
          retry() { for i in 1 2 3; do "$@" && return 0; echo "upload pass $i failed; retrying" >&2; sleep $((i * 20)); done; return 1; }
          retry aws s3 sync state/ "s3://$R2_STATE_BUCKET/state/" --endpoint-url "$R2_ENDPOINT" --only-show-errors --exclude "issues/*"
          retry aws s3 sync site/public/data/ "s3://$R2_STATE_BUCKET/published/data/" --endpoint-url "$R2_ENDPOINT" --only-show-errors --delete
      - name: Upload redistributable files (tool runtimes, redistributable raw archive) to the public R2 bucket
        if: env.R2_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && (env.ALWAYS_DEPLOY == 'true' || steps.pipeline.outputs.changed == 'true')
        run: |
          aws configure set default.s3.max_concurrent_requests 4
          for i in 1 2 3; do aws s3 sync site/dist-r2/ "s3://$R2_BUCKET/" --endpoint-url "$R2_ENDPOINT" --only-show-errors && exit 0; sleep $((i * 20)); done; exit 1
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.PAGES_PROJECT != '' && env.CLOUDFLARE_API_TOKEN != '' && (env.ALWAYS_DEPLOY == 'true' || steps.pipeline.outputs.changed == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site/dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
      - name: Start the live-site health check
        if: steps.deploy.outcome == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run health-check.yml --repo "${{ github.repository }}" || true
      - name: Open GitHub issues for anything that needs a person (issues only)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/open_issues.py
      - name: Open an issue if the run itself failed
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create pipeline --color 6b7280 2>/dev/null || true
          gh issue create --title "[pipeline] Scheduled update failed" --label pipeline \
            --body "The scheduled update failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The last good snapshot stays live. Nothing was changed automatically; a person needs to review." || true
