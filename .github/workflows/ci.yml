name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Pipeline unit tests (connectors, validators, revisions, lag, flags, events, geocoding)
        working-directory: pipeline
        run: python -m pytest -q tests/test_pipeline.py
      - name: Build data from live sources (failures keep the last good data and write issue requests)
        working-directory: pipeline
        run: python -m uo.build
      - name: Source traceability tests (block deployment on any violation) and notebook tests
        working-directory: pipeline
        run: python -m pytest -q tests/test_traceability.py tests/test_notebooks.py
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { packages: "any::deSolve, any::dplyr, any::tidyr, any::arrow, any::jsonlite" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: node scripts/prepare-tools.mjs
      - name: Translation completeness (fails on a missing key in any launch locale)
        working-directory: site
        run: npm run check:i18n
      - name: Frontend and simulation engine tests (generated Python, SQL and R code is executed)
        working-directory: site
        env: { UO_RSCRIPT: Rscript, UO_PYTHON: python }
        run: npm test
      - name: Production build
        working-directory: site
        run: npm run build
      - name: Lazy-loading check (tool runtimes and solvers absent from main and embed bundles)
        working-directory: site
        run: npm run check:bundles
