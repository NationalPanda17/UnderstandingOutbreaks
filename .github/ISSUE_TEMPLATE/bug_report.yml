name: Bug report
description: Something on the site or in the pipeline is wrong or broken
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: "Include the page URL (with its snapshot parameter if possible) and what you expected." }
    validations: { required: true }
  - type: textarea
    attributes: { label: Steps to reproduce }
  - type: input
    attributes: { label: Browser and device }
