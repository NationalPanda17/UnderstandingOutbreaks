# Disease vocabulary and per-disease configuration.
# Adding a disease is a config change. data_type: timeseries | events | both.
# icd11 / mesh: filled only where a clear one-to-one mapping exists; blank otherwise. All flagged for human review.
# aliases: lower-case names, spelling variants, and pathogen names that normalize to this disease.
# lag_default_periods: used until enough snapshots exist to estimate reporting lag from observed revisions.
vocabulary_version: 1
diseases:
  - id: influenza
    name: Influenza
    icd11: ""
    mesh: D007251
    data_type: both
    seasonal: true
    cadence: weekly
    datasets: [who_flunet_weekly]
    default_series: {dataset: who_flunet_weekly, metric: detections, case_definition: confirmed, surveillance_system: all_reported}
    rate_metric: false
    map_metric: percent_positive
    aliases: [influenza, seasonal influenza, flu, influenza a, influenza b]
  - id: covid19
    name: COVID-19
    icd11: RA01
    mesh: D000086382
    data_type: both
    seasonal: false
    cadence: weekly
    datasets: [who_covid_weekly]
    default_series: {dataset: who_covid_weekly, metric: cases, case_definition: confirmed, surveillance_system: national_notification}
    rate_metric: true
    aliases: [covid-19, covid19, coronavirus disease 2019, coronavirus disease (covid-19), sars-cov-2, novel coronavirus, 2019-ncov]
  - id: mpox
    name: Mpox
    icd11: 1E71
    mesh: D045908
    data_type: both
    seasonal: false
    cadence: weekly
    datasets: [who_mpox_daily, owid_mpox]
    default_series: {dataset: who_mpox_daily, metric: cases, case_definition: confirmed, surveillance_system: national_notification}
    rate_metric: true
    aliases: [mpox, monkeypox, monkeypox virus, mpxv, multi-country monkeypox outbreak]
  - id: measles
    name: Measles
    icd11: 1F03
    mesh: D008457
    data_type: both
    seasonal: false
    cadence: monthly
    datasets: [who_measles_monthly, who_wiise_measles, owid_measles]
    default_series: {dataset: who_measles_monthly, metric: cases, case_definition: notified, surveillance_system: case_based_surveillance}
    rate_metric: true
    aliases: [measles, rougeole, measles virus]
  - id: cholera
    name: Cholera
    icd11: 1A00
    mesh: D002771
    data_type: both
    seasonal: false
    cadence: yearly
    datasets: [owid_cholera, who_gho_cholera]
    default_series: {dataset: owid_cholera, metric: cases, case_definition: notified, surveillance_system: national_notification}
    rate_metric: true
    aliases: [cholera, vibrio cholerae, acute watery diarrhoea, acute watery diarrhea, acute watery diarrhoea/cholera]
  - id: dengue
    name: Dengue
    icd11: ""
    mesh: D003715
    data_type: both
    seasonal: true
    cadence: yearly
    datasets: [opendengue_national]
    default_series: {dataset: opendengue_national, metric: cases, case_definition: mixed, surveillance_system: compiled_public_reports}
    rate_metric: true
    aliases: [dengue, dengue fever, severe dengue, dengue haemorrhagic fever, dengue hemorrhagic fever, dengue virus]
  - id: polio
    name: Poliomyelitis
    icd11: 1C81
    mesh: D011051
    data_type: both
    seasonal: false
    cadence: yearly
    datasets: [who_wiise_polio, owid_polio]
    default_series: {dataset: who_wiise_polio, metric: cases, case_definition: notified, surveillance_system: national_notification}
    rate_metric: true
    aliases: [polio, poliomyelitis, poliovirus, wild poliovirus, wild poliovirus type 1, wpv1, circulating vaccine-derived poliovirus, circulating vaccine-derived poliovirus type 2, cvdpv2, cvdpv1, cvdpv, vaccine-derived poliovirus]
