# Notice names a person has reviewed and decided to leave under "Other / unclassified": syndromes with no named
# disease, undiagnosed illness, mixed-pathogen summaries and non-infectious events. They are matched exactly (after
# case and accent folding), are never mapped to a disease, and no longer raise an "unmapped disease" issue.
reviewed_unclassified:
  - Acute fever and rash syndrome
  - Acute haemorrhagic fever syndrome
  - Suspected Acute Haemorrhagic Fever
  - Suspected acute haemorrhagic fever syndrome
  - Acute respiratory syndrome
  - Bloody diarrhoea
  - Cases of Undiagnosed Febrile Illness
  - Cluster of community deaths
  - Epidemic encephalitis
  - Guillain-Barré Syndrome
  - Hurricane
  - "International food safety event: Infant formula and products containing arachidonic acid oil contaminated with cereulide toxin"
  - Mass Bromide Poisoning
  - Myocarditis (acute infective)
  - Pneumonia of undetermined etiology
  - "Trends of acute respiratory infection, including human metapneumovirus, in the Northern Hemisphere"
  - Undiagnosed disease
  - Upsurge of respiratory illnesses among children-Northern China
# Countries, regions and generic words that are stripped before matching a notice title to a disease.
title_noise: [update, situation, outbreak, outbreaks, global, multi-country, multi country, the, in, of, and, cases, case, human, infection, with, virus, disease, caused, by, suspected, confirmed, regional, region, "- ", "– "]
